<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reports</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<aside class="sidebar">

<div class="logo">
<h2>Smart Inventory</h2>
</div>

<ul>

<li>
<a href="index.html">
<i class="fas fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="inventory.html">
<i class="fas fa-boxes"></i>
Inventory
</a>
</li>

<li>
<a href="alerts.html">
<i class="fas fa-triangle-exclamation"></i>
Alerts
</a>
</li>

<li class="active">
<a href="reports.html">
<i class="fas fa-chart-bar"></i>
Reports
</a>
</li>

</ul>

</aside>

<main class="main-content">

<header>

<div>

<h1>Reports</h1>

<p>Inventory Statistics</p>

</div>

</header>

<section class="cards">

<div class="card">

<i class="fas fa-box card-icon"></i>

<h3>Total Products</h3>

<h2>20</h2>

</div>

<div class="card">

<i class="fas fa-arrow-trend-up card-icon"></i>

<h3>Products Available</h3>

<h2>18</h2>

</div>

<div class="card">

<i class="fas fa-triangle-exclamation card-icon"></i>

<h3>Low Stock</h3>

<h2>2</h2>

</div>

</section>

<section class="table-section">

<table>

<thead>

<tr>

<th>Report</th>

<th>Value</th>

</tr>

</thead>

<tbody>

<tr>

<td>Total Products</td>

<td>20</td>

</tr>

<tr>

<td>Available</td>

<td>18</td>

</tr>

<tr>

<td>Low Stock</td>

<td>2</td>

</tr>

<tr>

<td>Last Update</td>

<td>Today 10:45 AM</td>

</tr>

</tbody>

</table>

</section>

</main>

</body>

</html>
