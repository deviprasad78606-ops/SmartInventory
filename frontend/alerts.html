<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Alerts</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<aside class="sidebar">

<div class="logo">
<h2>Smart Inventory</h2>
</div>

<ul>

<li>
<a href="index.html">
<i class="fas fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="inventory.html">
<i class="fas fa-boxes"></i>
Inventory
</a>
</li>

<li class="active">
<a href="alerts.html">
<i class="fas fa-triangle-exclamation"></i>
Alerts
</a>
</li>

<li>
<a href="reports.html">
<i class="fas fa-chart-bar"></i>
Reports
</a>
</li>

</ul>

</aside>

<main class="main-content">

<header>

<div>

<h1>Alerts</h1>

<p>Inventory Notifications</p>

</div>

</header>

<section class="cards">

<div class="card">

<i class="fas fa-triangle-exclamation card-icon"></i>

<h3>Low Stock Alerts</h3>

<h2>2</h2>

</div>

<div class="card">

<i class="fas fa-bell card-icon"></i>

<h3>Total Notifications</h3>

<h2>5</h2>

</div>

</section>

<section class="table-section">

<table>

<thead>

<tr>

<th>Product</th>

<th>Message</th>

<th>Status</th>

</tr>

</thead>

<tbody>

<tr>

<td>Biscuits</td>

<td>Stock Below Threshold</td>

<td><span class="status low">Urgent</span></td>

</tr>

<tr>

<td>Milk</td>

<td>Inventory Updated</td>

<td><span class="status available">Completed</span></td>

</tr>

</tbody>

</table>

</section>

</main>

</body>

</html>
