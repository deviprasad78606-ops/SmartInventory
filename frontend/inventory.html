<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<aside class="sidebar">

<div class="logo">
<h2>Smart Inventory</h2>
</div>

<ul>

<li>
<a href="index.html">
<i class="fas fa-chart-line"></i>
Dashboard
</a>
</li>

<li class="active">
<a href="inventory.html">
<i class="fas fa-boxes"></i>
Inventory
</a>
</li>

<li>
<a href="alerts.html">
<i class="fas fa-triangle-exclamation"></i>
Alerts
</a>
</li>

<li>
<a href="reports.html">
<i class="fas fa-chart-bar"></i>

</a>
</li>

</ul>

</aside>

<main class="main-content">

<header>

<div>
<h1>Inventory</h1>
<p>Current Inventory Status</p>
</div>

</header>

<section class="table-section">

<table>

<thead>

<tr>

<th>ID</th>
<th>Product</th>
<th>Stock</th>
<th>Threshold</th>
<th>Status</th>

</tr>

</thead>

<tbody>

<tr>
<td>101</td>
<td>Milk</td>
<td>15</td>
<td>5</td>
<td><span class="status available">Available</span></td>
</tr>

<tr>
<td>102</td>
<td>Biscuits</td>
<td>3</td>
<td>5</td>
<td><span class="status low">Low Stock</span></td>
</tr>

<tr>
<td>103</td>
<td>Chocolate</td>
<td>12</td>
<td>5</td>
<td><span class="status available">Available</span></td>
</tr>

<tr>
<td>104</td>
<td>Juice</td>
<td>9</td>
<td>5</td>
<td><span class="status available">Available</span></td>
</tr>

</tbody>

</table>

</section>

</main>

</body>

</html>
